name: Auto Update Package

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:   # Manual trigger

jobs:
  auto_update:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Chocolatey-AU Action
        uses: chocolatey-community/chocolatey-au-action@3.0
        with:
          package-paths: diff-pdf*
          push: true
          api-key: ${{ secrets.CHOCO_API_KEY }}
          commit-changes: true
          commit-message: 'chore: automatic package update [skip ci]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

